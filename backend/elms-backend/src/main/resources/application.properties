spring.application.name=elms-backend

# PostgreSQL Database
spring.datasource.url=jdbc:postgresql://localhost:5432/elms_db
spring.datasource.username=postgres
spring.datasource.password=kenisha

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Server
server.port=8080

# JWT Configuration
jwt.secret=CHANGE_THIS_TO_A_LONG_SECURE_SECRET_KEY_FOR_ELMS
jwt.expiration=86400000